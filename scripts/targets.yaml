# yaml-language-server: $schema=../schemas/targets.schema.json
# Build target manifest: route per-target source artifacts to harness outputs.

agents:
  entries:
    vertex-security-agent:
      targets:
        copilot:
          from: src/copilot/agents/Vertex-security-agent.agent.md
          to: github/agents/Vertex-security-agent.agent.md
        eca:
          from: src/eca/agents/vertex-security-agent.md
          to: eca-plugins/vertex-security/agents/vertex-security-agent.md

instructions:
  entries:
    snyk-rules:
      targets:
        copilot:
          from: src/copilot/instructions/snyk_rules.instructions.md
          to: github/snyk_rules.instructions.md
        eca:
          from: src/eca/rules/snyk-rules.md
          to: eca-plugins/vertex-security/rules/snyk-rules.md

    snyk-security-review:
      targets:
        copilot:
          from: src/copilot/instructions/snyk_security_review.instructions.md
          to: github/snyk_security_review.instructions.md
        eca:
          from: src/eca/skills/security-review/snyk-security-review.md
          to: eca-plugins/vertex-security/skills/snyk-security-review/SKILL.md

    deep-code-review:
      targets:
        copilot:
          from: src/copilot/instructions/deep_code_review.instructions.md
          to: github/deep_code_review.instructions.md
        eca:
          from: src/eca/skills/security-review/deep-code-review.md
          to: eca-plugins/vertex-security/skills/deep-code-review/SKILL.md

commands:
